name: Android emulator runtime smoke (development)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tools/android_emulator_smoke.sh'
      - 'tools/android_ui_probe.py'
      - '.github/workflows/android-emulator-smoke.yml'
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build testable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM on Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator install, offline launch and rotation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_emulator_smoke.sh
      - name: Retain screen and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlazeCircuitLab-emulator-smoke-evidence
          path: build/android-smoke/**
          if-no-files-found: warn
          retention-days: 7