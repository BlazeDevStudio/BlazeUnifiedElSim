name: Android APK build (development only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM core tests (Android Gradle unit tests)
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK (NOT a signed release)
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload actual built artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlazeCircuitLab-native-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
