name: Blaze CircuitLab migration and Android build gate

on:
  workflow_dispatch:
  push:
    branches: [main, 'migration/**']
  pull_request:

permissions:
  contents: read

jobs:
  import-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python import security regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  android-debug:
    needs: import-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native source migration gate
        run: |
          test -f settings.gradle.kts || { echo "::error::Full native Kotlin source not imported"; exit 1; }
          test -f app/build.gradle.kts || exit 1
          test -f app/src/main/java/com/blaze/circuitlab/core/MnaSolver.kt || exit 1
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish verified debug APK as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlazeCircuitLab-debug-unsigned
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
